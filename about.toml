# cargo-about config for THIRD-PARTY-LICENSES.html (regenerate with scripts/third-party-licenses.sh).
# Where a crate offers a choice, the first accepted licence in this list is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MIT-0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
