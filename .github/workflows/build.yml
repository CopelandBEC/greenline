name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fetched from GitHub rather than apt: the runners' apt intermittently can't resolve the Ubuntu mirrors.
      - name: Fonts used by the export tests
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/share/fonts/truetype/liberation /usr/share/fonts/truetype/noto
          curl -fsSL --retry 3 https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz \
            | sudo tar -xz --strip-components=1 -C /usr/share/fonts/truetype/liberation liberation-fonts-ttf-2.1.5/LiberationSans-Regular.ttf
          for f in NotoSans NotoSansMath NotoSansSymbols NotoSansSymbols2; do
            sudo curl -fsSL --retry 3 -o /usr/share/fonts/truetype/noto/$f-Regular.ttf \
              https://github.com/notofonts/notofonts.github.io/raw/main/fonts/$f/hinted/ttf/$f-Regular.ttf
          done
          ls -l /usr/share/fonts/truetype/liberation /usr/share/fonts/truetype/noto
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: scripts/fetch-pdfium.sh
      - run: cargo test --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Fetch PDFium
        shell: bash
        run: scripts/fetch-pdfium.sh
      - name: Test (PDFium render + export on Windows)
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\greenline.iss
      - uses: actions/upload-artifact@v7
        with:
          name: Greenline-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/*.exe
            target/release/greenline.exe
            target/release/greenline-cli.exe
            vendor/pdfium.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Greenline-*-windows
          merge-multiple: true
          path: artifact
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifact/dist/*.exe \
            --title "Greenline $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
