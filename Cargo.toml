[package]
name = "greenline"
version = "1.3.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CopelandBEC/greenline"
description = "Lean native PDF markup for drawing-set review"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
rfd = "=0.17.2"
egui = { version = "=0.36.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dunce = "=1.0.5"
skrifa = "=0.44.0"

[build-dependencies]
embed-resource = "=3.0.12"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
