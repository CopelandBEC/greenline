[package]
name = "redline"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
rfd = "=0.17.2"
egui = { version = "=0.36.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
skrifa = "=0.44.0"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
